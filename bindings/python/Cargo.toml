[package]
name = "linnet-tts-py"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/VoxRT/LinnetTTS"
description = "Python extension module for the LinnetTTS runtime"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
linnet-tts = { path = "../../runtime/linnet-tts" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
