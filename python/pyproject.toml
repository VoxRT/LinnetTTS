[project]
name = "linnet-tts-torch"
version = "0.1.0"
description = "LinnetTTS reference model in PyTorch (inference only)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "sentencepiece", "safetensors", "soundfile"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linnet_tts_torch*"]
