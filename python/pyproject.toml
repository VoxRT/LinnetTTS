[project]
name = "linnet-tts-torch"
version = "0.1.1"
description = "LinnetTTS reference model in PyTorch (inference only)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "sentencepiece", "safetensors", "soundfile"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Repository = "https://github.com/VoxRT/LinnetTTS"
Weights = "https://github.com/VoxRT/LinnetTTS/releases/tag/weights-v1"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linnet_tts_torch*"]
