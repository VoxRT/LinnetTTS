[package]
name = "linnet-tts"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LinnetTTS runtime: flow LM + Vocos-style codec decoder, streaming synthesis, C API"
rust-version = "1.85"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
linnet-ops = { path = "../linnet-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Route every kernel (including this crate's own RoPE rotation) through
# the scalar reference. For parity checks and baselines only.
force-scalar = ["linnet-ops/force-scalar"]

[[example]]
name = "synth"
